<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Концепты плеера</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#141416;color:#eee;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
h1{font-size:18px;font-weight:600;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:16px}
.tabs button{background:#232327;color:#ccc;border:1px solid #333;border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
.tabs button.on{background:#eee;color:#111;border-color:#eee}
.wrap{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.phone{width:360px;height:720px;border-radius:44px;border:10px solid #000;overflow:hidden;position:relative;background:#000;box-shadow:0 20px 60px #0008;flex:none}
.phone>div{width:100%;height:100%;position:relative;overflow:hidden;user-select:none;touch-action:none}
.phone>div>div{height:100%}
.info{max-width:340px;font-size:14px;line-height:1.5;color:#bbb}
.info h2{color:#fff;font-size:18px;margin-bottom:6px}
.info b{color:#8fd18f}.info i{color:#e69a8a;font-style:normal;font-weight:700}
.info p{margin-bottom:10px}
button{font-family:inherit}

/* ---------- 1. iPod ---------- */
.ipod{background:linear-gradient(160deg,#e8e8ea,#c9c9cd);padding:26px 22px;display:flex;flex-direction:column;align-items:center;color:#111}
.ip-screen{width:100%;height:232px;background:#cde0ee;border:4px solid #555;border-radius:8px;overflow:hidden;font-family:Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
.ip-bar{height:24px;background:linear-gradient(#f5f5f5,#b9b9b9);border-bottom:1px solid #777;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-size:13px;font-weight:700}
.ip-list{flex:1;overflow:hidden}
.ip-row{height:26px;padding:0 10px;display:flex;justify-content:space-between;align-items:center;font-size:15px;white-space:nowrap}
.ip-row.sel{background:linear-gradient(#5aa7e8,#1d6fc2);color:#fff}
.ip-np{padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.ip-np .t{font-weight:700;font-size:16px}
.ip-np .pb{height:10px;border:1px solid #444;background:#fff;margin-top:12px;border-radius:2px;overflow:hidden}
.ip-np .pb i{display:block;height:100%;background:linear-gradient(#5aa7e8,#1d6fc2)}
.ip-np .tm{display:flex;justify-content:space-between;font-size:12px}
.wheel{position:relative;width:250px;height:250px;border-radius:50%;background:radial-gradient(#fafafa,#dcdcdf);box-shadow:inset 0 0 0 1px #bbb,0 2px 6px #0003;margin-top:34px;touch-action:none}
.wheel .wb{position:absolute;background:none;border:0;font-weight:700;font-size:13px;color:#666;cursor:pointer;width:60px;height:36px}
.wb.m{top:10px;left:95px}.wb.n{right:6px;top:107px}.wb.p{left:6px;top:107px}.wb.pl{bottom:10px;left:95px}
.wheel .center{position:absolute;left:80px;top:80px;width:90px;height:90px;border-radius:50%;border:1px solid #aaa;background:radial-gradient(#f0f0f2,#c9c9cd);cursor:pointer}
.wheel .center:active{background:#b8b8bc}

/* ---------- 2. TE ---------- */
.te{background:#d8d8d4;padding:22px;display:flex;flex-direction:column;gap:18px;font-family:'DotGothic16',monospace;color:#222}
.lcd{background:#a8b88c;border-radius:10px;padding:12px 14px;box-shadow:inset 0 3px 8px #0006;height:128px;display:flex;flex-direction:column;justify-content:space-between;color:#2b3320;font-size:20px;letter-spacing:1px}
.lcd small{font-size:14px;opacity:.75}
.lcd .bar{height:8px;background:#2b332033;border-radius:2px;overflow:hidden}.lcd .bar i{display:block;height:100%;background:#2b3320}
.knobwrap{display:flex;justify-content:center;padding:6px 0}
.knob{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bdbdb8);box-shadow:0 8px 14px #0004,inset 0 -4px 8px #0002;position:relative;touch-action:none;cursor:grab}
.knob i{position:absolute;left:50%;top:10px;width:8px;height:34px;margin-left:-4px;background:#ff5a1f;border-radius:4px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad{height:52px;border-radius:10px;border:0;background:#eeeee9;box-shadow:0 4px 0 #a9a9a3;font:inherit;font-size:20px;color:#444;cursor:pointer}
.pad:active{transform:translateY(3px);box-shadow:0 1px 0 #a9a9a3}
.pad.on{background:#ff5a1f;color:#fff;box-shadow:0 4px 0 #b53a0f}
.te .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.te .tr .pad{background:#2c2c2c;color:#fff;box-shadow:0 4px 0 #000}

/* ---------- 3. Cassette ---------- */
.cas{background:#2a2420 repeating-linear-gradient(90deg,#0000 0 3px,#0000000d 3px 4px);padding:20px;display:flex;flex-direction:column;gap:16px;font-family:'Courier New',monospace}
.cas svg{width:100%}
.spin{transform-box:fill-box;transform-origin:center;animation:sp 2.2s linear infinite;animation-play-state:paused}
.cas.play .spin{animation-play-state:running}
@keyframes sp{to{transform:rotate(360deg)}}
.sideA{background:#e7dcc0;color:#2a1d12;border-radius:6px;padding:8px 12px;font-size:13px}
.sideA div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #2a1d1255;cursor:pointer}
.sideA div.on{font-weight:700}.sideA div.on:before{content:'▶ '}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.keys button{height:54px;background:linear-gradient(#cfcfcf,#8d8d8d);border:0;border-radius:3px 3px 0 0;box-shadow:0 5px 0 #444;font-size:20px;color:#222;cursor:pointer}
.keys button:active,.keys button.on{transform:translateY(4px);box-shadow:0 1px 0 #444}

/* ---------- 4. Vinyl ---------- */
.vin{background:radial-gradient(circle at 50% 30%,#4a3a2c,#1a130e);color:#f2e6d2;display:flex;flex-direction:column;align-items:center;padding-top:50px}
.rec{width:280px;height:280px;border-radius:50%;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1b1b1b 2px 4px);position:relative;box-shadow:0 10px 30px #000a;animation:sp 3.6s linear infinite;animation-play-state:paused}
.vin.play .rec{animation-play-state:running}
.rec:before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(#fff1,#0000 20%,#fff1 50%,#0000 70%,#fff1)}
.rec .lb{position:absolute;inset:95px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.rec .lb:after{content:'';width:10px;height:10px;border-radius:50%;background:#1a130e}
.arm{position:absolute;right:34px;top:20px;width:8px;height:200px;background:linear-gradient(90deg,#ddd,#888);border-radius:4px;transform-origin:50% 10px;transition:transform .9s;z-index:2}
.arm:before{content:'';position:absolute;left:-12px;top:-6px;width:32px;height:32px;border-radius:50%;background:#555;border:3px solid #999}
.arm:after{content:'';position:absolute;left:-6px;bottom:-8px;width:20px;height:22px;background:#222;border-radius:3px}
.vin .meta{text-align:center;margin-top:22px}
.vin .meta b{font-size:20px;display:block}.vin .meta span{opacity:.7;font-size:14px}
.vin .pb{width:260px;height:3px;background:#fff3;margin:14px 0 10px;border-radius:2px}.vin .pb i{display:block;height:100%;background:#f2c46a;border-radius:2px}
.vin .ctl{display:flex;gap:26px;align-items:center}
.vin .ctl button{background:none;border:0;color:#f2e6d2;font-size:26px;cursor:pointer}
.vin .ctl .pp{width:56px;height:56px;border-radius:50%;background:#f2c46a;color:#1a130e;font-size:22px}
.sleeves{display:flex;gap:10px;overflow-x:auto;width:100%;padding:18px 20px;margin-top:auto;touch-action:pan-x}
.sleeves div{flex:none;width:74px;height:74px;border-radius:4px;box-shadow:0 4px 10px #0008;opacity:.55;cursor:pointer}
.sleeves div.on{opacity:1;outline:2px solid #f2c46a}

/* ---------- 5. Dot ---------- */
.dot{background:#000;color:#fff;font-family:'DotGothic16',monospace;display:flex;flex-direction:column;align-items:center;padding-top:34px}
.dot .ring{position:relative;width:300px;height:300px}
.dot .ring svg{position:absolute;inset:0}
.dot .ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.dot .time{font-size:52px;letter-spacing:2px}
.dot .tt{font-size:16px;text-align:center;max-width:200px}.dot .ta{font-size:13px;color:#888}
.dot .ctl{display:flex;gap:22px;margin-top:20px}
.dot .ctl button{width:58px;height:58px;border-radius:50%;border:1.5px solid #fff;background:none;color:#fff;font-size:18px;cursor:pointer;font-family:inherit}
.dot .ctl .pp{background:#d71921;border-color:#d71921}
.dot .list{width:100%;padding:18px 26px;margin-top:auto;font-size:14px;color:#777}
.dot .list div{display:flex;justify-content:space-between;padding:5px 0;cursor:pointer}
.dot .list div.on{color:#fff}.dot .list div.on:before{content:'●';color:#d71921;margin-right:8px}
</style>
</head>
<body>
<h1>Концепты личного плеера</h1>
<div class="tabs" id="tabs"></div>
<div class="wrap">
  <div class="phone"><div id="stage"></div></div>
  <div class="info" id="info"></div>
</div>

<script>
const T=[
 {t:'Midnight City',a:'M83',d:243,h:260},
 {t:'Nightcall',a:'Kavinsky',d:258,h:350},
 {t:'Instant Crush',a:'Daft Punk',d:337,h:30},
 {t:'Resonance',a:'HOME',d:212,h:190},
 {t:'Tadow',a:'Masego',d:231,h:45},
 {t:'Intro',a:'The xx',d:127,h:210},
];
const S={cur:0,pos:0,play:false};
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const $=(s)=>document.querySelector(s);
const col=(h,s=55,l=50)=>`hsl(${h} ${s}% ${l}%)`;
function go(i,play){S.cur=(i+T.length)%T.length;S.pos=0;if(play!==undefined)S.play=play;upd()}
function toggle(){S.play=!S.play;upd()}
function seek(dt){S.pos=Math.max(0,Math.min(T[S.cur].d-1,S.pos+dt));upd()}
setInterval(()=>{if(S.play){S.pos+=.25;if(S.pos>=T[S.cur].d)go(S.cur+1)}upd()},250);
const prog=()=>S.pos/T[S.cur].d;
const set=(id,v)=>{const e=document.getElementById(id);if(e&&e.textContent!==v)e.textContent=v};
const sty=(id,p,v)=>{const e=document.getElementById(id);if(e)e.style[p]=v};
const on=(sel,ev,fn)=>document.querySelectorAll(sel).forEach(e=>e.addEventListener(ev,fn));

/* rotary drag helper: calls cb(deltaDegrees) */
function rotary(el,cb){
  let last=null;
  el.addEventListener('pointerdown',e=>{if(e.target!==el)return;el.setPointerCapture(e.pointerId);last=ang(e)});
  el.addEventListener('pointermove',e=>{if(last===null)return;const a=ang(e);let d=a-last;if(d>180)d-=360;if(d<-180)d+=360;last=a;cb(d)});
  const end=()=>last=null;el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  function ang(e){const r=el.getBoundingClientRect();return Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI}
}

const C={};
let active='ipod';

/* ===== 1. iPod ===== */
C.ipod={
 name:'1. iPod Classic',
 info:`<h2>iPod Classic · click wheel</h2><p>Тот самый экран с меню и колесо. Крути пальцем по белому кольцу — список прокручивается (на Android даём лёгкую вибрацию на каждый «щелчок»). Центр — выбрать, MENU — назад. В «Now Playing» колесо перематывает трек.</p><p><b>+</b> Узнаваемо, всё делается одной рукой, не надо целиться в маленькие кнопки.<br><i>−</i> Экран телефона используется слабо, нужен «фальшивый» маленький дисплей.</p>`,
 st:{stack:['menu'],idx:{menu:0,songs:0}},
 menu:['Now Playing','Songs','Albums','Artists','Shuffle','Settings'],
 mount(el){
  el.innerHTML=`<div class="ipod"><div class="ip-screen"><div class="ip-bar"><span id="ip-h">iPod</span><span id="ip-s"></span></div><div class="ip-list" id="ip-b"></div></div>
  <div class="wheel" id="wheel"><button class="wb m" data-k="menu">MENU</button><button class="wb n" data-k="next">⏭</button><button class="wb p" data-k="prev">⏮</button><button class="wb pl" data-k="pp">⏯</button><button class="center" id="ok"></button></div></div>`;
  const w=$('#wheel');let acc=0;
  rotary(w,d=>{acc+=d;while(acc>=24){this.move(1);acc-=24}while(acc<=-24){this.move(-1);acc+=24}});
  w.addEventListener('wheel',e=>{e.preventDefault();this.move(e.deltaY>0?1:-1)},{passive:false});
  $('#ok').onclick=()=>this.select();
  w.querySelectorAll('.wb').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k=='menu')this.back();if(k=='next')go(S.cur+1);if(k=='prev')go(S.cur-1);if(k=='pp')toggle()});
  this.render();
 },
 top(){return this.st.stack[this.st.stack.length-1]},
 move(d){
  navigator.vibrate&&navigator.vibrate(5);
  const s=this.top();
  if(s=='np'){seek(d*5);return}
  const n=s=='menu'?this.menu.length:T.length;
  this.st.idx[s]=Math.max(0,Math.min(n-1,this.st.idx[s]+d));this.render();
 },
 select(){
  const s=this.top();
  if(s=='menu'){const i=this.st.idx.menu;
    if(i==0)this.st.stack.push('np');else if(i==4){go(Math.floor(Math.random()*T.length),true);this.st.stack.push('np')}else this.st.stack.push('songs')}
  else if(s=='songs'){go(this.st.idx.songs,true);this.st.stack.push('np')}
  else if(s=='np')toggle();
  this.render();
 },
 back(){if(this.st.stack.length>1)this.st.stack.pop();this.render()},
 render(){
  const s=this.top(),b=$('#ip-b');if(!b)return;
  set('ip-h',s=='menu'?'iPod':s=='songs'?'Songs':'Now Playing');
  if(s=='np'){b.innerHTML=`<div class="ip-np"><div class="t" id="ip-t"></div><div id="ip-a"></div><div class="pb"><i id="ip-p"></i></div><div class="tm"><span id="ip-c"></span><span id="ip-r"></span></div></div>`;this.update();return}
  const items=s=='menu'?this.menu:T.map(x=>x.t),i=this.st.idx[s];
  const from=Math.max(0,Math.min(i-3,items.length-7));
  b.innerHTML=items.slice(from,from+7).map((x,k)=>`<div class="ip-row ${from+k==i?'sel':''}"><span>${x}</span><span>${s=='menu'?'›':''}</span></div>`).join('');
  this.update();
 },
 update(){
  set('ip-s',S.play?'▶':'❚❚');
  if(this.top()!='np')return;
  const t=T[S.cur];set('ip-t',t.t);set('ip-a',t.a);set('ip-c',fmt(S.pos));set('ip-r','-'+fmt(t.d-S.pos));sty('ip-p','width',prog()*100+'%');
 }
};

/* ===== 2. Teenage Engineering ===== */
C.te={
 name:'2. Hardware-синт',
 info:`<h2>Teenage Engineering стиль</h2><p>Серый корпус, оранжевый акцент, LCD с точечным шрифтом. Большая ручка — перемотка (крутишь пальцем по кругу), 6 пэдов — это 6 треков в быстром доступе, как в сэмплере.</p><p><b>+</b> Очень «игрушечный» и тактильный, красиво выглядит в светлой теме.<br><i>−</i> Плохо масштабируется на большую библиотеку — только избранное на пэдах, остальное в отдельном списке.</p>`,
 mount(el){
  el.innerHTML=`<div class="te"><div class="lcd"><div><div id="te-1"></div><small id="te-2"></small></div><div><div style="display:flex;justify-content:space-between"><small id="te-c"></small><small id="te-r"></small></div><div class="bar"><i id="te-b"></i></div></div></div>
  <div class="knobwrap"><div class="knob" id="knob"><i></i></div></div>
  <div class="pads">${T.map((t,i)=>`<button class="pad" data-i="${i}" id="pd${i}">${i+1}</button>`).join('')}</div>
  <div class="tr"><button class="pad" id="te-p">◀◀</button><button class="pad" id="te-pp">▶</button><button class="pad" id="te-n">▶▶</button></div></div>`;
  rotary($('#knob'),d=>seek(d/270*T[S.cur].d*0.5));
  on('.pad[data-i]','click',e=>go(+e.currentTarget.dataset.i,true));
  $('#te-p').onclick=()=>go(S.cur-1);$('#te-n').onclick=()=>go(S.cur+1);$('#te-pp').onclick=toggle;
  this.update();
 },
 update(){
  const t=T[S.cur];
  set('te-1',t.t.toUpperCase());set('te-2',t.a.toUpperCase());set('te-c',fmt(S.pos));set('te-r','-'+fmt(t.d-S.pos));
  sty('te-b','width',prog()*100+'%');
  set('te-pp',S.play?'❚❚':'▶');
  const k=$('#knob');if(k)k.style.transform=`rotate(${-135+prog()*270}deg)`;
  T.forEach((_,i)=>{const p=document.getElementById('pd'+i);if(p)p.classList.toggle('on',i==S.cur)});
 }
};

/* ===== 3. Cassette ===== */
C.cas={
 name:'3. Кассета',
 info:`<h2>Кассетный Walkman</h2><p>В окошке кассеты крутятся бобины, плёнка перематывается с левой на правую по мере прослушивания — прогресс виден физически, без полоски. Список треков — «Side A» на вкладыше, кнопки — механические клавиши с нажатием.</p><p><b>+</b> Прогресс и состояние читаются мгновенно, очень уютный ретро-вайб.<br><i>−</i> Графика сложнее в разработке (Canvas/Compose), плюс анимацию нужно оптимизировать ради батареи.</p>`,
 mount(el){
  const hubs=(cx)=>`<g class="spin"><circle cx="${cx}" cy="105" r="17" fill="#eee"/>${[0,60,120,180,240,300].map(a=>`<rect x="${cx-2}" y="${105-17}" width="4" height="9" fill="#333" transform="rotate(${a} ${cx} 105)"/>`).join('')}<circle cx="${cx}" cy="105" r="6" fill="#333"/></g>`;
  el.innerHTML=`<div class="cas" id="cas"><svg viewBox="0 0 320 210"><rect x="4" y="4" width="312" height="202" rx="14" fill="#c9bfa8"/><rect x="20" y="16" width="280" height="84" rx="6" fill="#f1e7c8"/>
   <text id="c-t" x="30" y="52" font-size="19" font-weight="700" fill="#b8321f" font-family="Courier New"></text><text id="c-a" x="30" y="78" font-size="14" fill="#2a1d12" font-family="Courier New"></text>
   <rect x="54" y="60" width="0" height="0"/><rect x="40" y="108" width="240" height="70" rx="35" fill="#1a1512"/>
   <circle id="c-l" cx="100" cy="105" r="40" fill="#4a3426"/><circle id="c-r" cx="220" cy="105" r="20" fill="#4a3426"/>${hubs(100)}${hubs(220)}
   <path d="M60 195 L90 175 L230 175 L260 195Z" fill="#8a8068"/></svg>
   <div class="sideA">${T.map((t,i)=>`<div data-i="${i}" id="sa${i}"><span>${t.t}</span><span>${fmt(t.d)}</span></div>`).join('')}</div>
   <div class="keys"><button id="k-p">⏮</button><button id="k-pp">▶</button><button id="k-n">⏭</button><button id="k-s">■</button></div></div>`;
  on('.sideA div','click',e=>go(+e.currentTarget.dataset.i,true));
  $('#k-p').onclick=()=>go(S.cur-1);$('#k-n').onclick=()=>go(S.cur+1);$('#k-pp').onclick=toggle;$('#k-s').onclick=()=>{S.play=false;S.pos=0;upd()};
  this.update();
 },
 update(){
  const t=T[S.cur],p=prog();
  set('c-t',t.t.toUpperCase().slice(0,18));set('c-a',t.a+' · SIDE A');
  const l=document.getElementById('c-l'),r=document.getElementById('c-r');
  if(l){l.setAttribute('r',40-20*p);r.setAttribute('r',20+20*p)}
  $('#cas').classList.toggle('play',S.play);
  const pp=$('#k-pp');pp.classList.toggle('on',S.play);
  T.forEach((_,i)=>document.getElementById('sa'+i)?.classList.toggle('on',i==S.cur));
 }
};

/* ===== 4. Vinyl ===== */
C.vin={
 name:'4. Винил',
 info:`<h2>Проигрыватель винила</h2><p>Пластинка крутится, игла опускается на дорожку и по мере трека ползёт к центру. Внизу — полка с конвертами альбомов, листаешь свайпом, тап — поставить пластинку.</p><p><b>+</b> Обложки становятся главным элементом, отлично подходит для любителей альбомов, а не отдельных треков.<br><i>−</i> Для больших библиотек полка конвертов неудобна, нужен обычный список как запасной вариант.</p>`,
 mount(el){
  el.innerHTML=`<div class="vin" id="vin"><div class="arm" id="arm"></div><div class="rec"><div class="lb" id="v-lb"></div></div>
  <div class="meta"><b id="v-t"></b><span id="v-a"></span></div><div class="pb"><i id="v-p"></i></div>
  <div class="ctl"><button id="v-prev">⏮</button><button class="pp" id="v-pp">▶</button><button id="v-next">⏭</button></div>
  <div class="sleeves">${T.map((t,i)=>`<div data-i="${i}" id="sl${i}" style="background:linear-gradient(135deg,${col(t.h,60,45)},${col(t.h+40,60,25)})"></div>`).join('')}</div></div>`;
  on('.sleeves div','click',e=>go(+e.currentTarget.dataset.i,true));
  $('#v-prev').onclick=()=>go(S.cur-1);$('#v-next').onclick=()=>go(S.cur+1);$('#v-pp').onclick=toggle;
  this.update();
 },
 update(){
  const t=T[S.cur];
  set('v-t',t.t);set('v-a',t.a);set('v-pp',S.play?'❚❚':'▶');sty('v-p','width',prog()*100+'%');
  sty('v-lb','background',col(t.h,65,50));
  $('#vin').classList.toggle('play',S.play);
  sty('arm','transform',`rotate(${S.play?22+prog()*12:0}deg)`);
  T.forEach((_,i)=>document.getElementById('sl'+i)?.classList.toggle('on',i==S.cur));
 }
};

/* ===== 5. Dot matrix ===== */
C.dot={
 name:'5. Dot-matrix',
 info:`<h2>Точечная матрица (в духе Nothing)</h2><p>Чёрный фон, точечный шрифт, один красный акцент. Прогресс — кольцо из 60 точек, которые загораются по ходу трека. Минимум декора, максимум читаемости, отлично смотрится на OLED (чёрный = экономия батареи).</p><p><b>+</b> Современно, дёшево в разработке, батарея тоже довольна.<br><i>−</i> Меньше «характера», чем у физических метафор вроде iPod или кассеты.</p>`,
 mount(el){
  const N=60;
  const dots=Array.from({length:N},(_,i)=>{const a=i/N*2*Math.PI-Math.PI/2;return `<circle id="dt${i}" cx="${150+Math.cos(a)*138}" cy="${150+Math.sin(a)*138}" r="3.2" fill="#333"/>`}).join('');
  el.innerHTML=`<div class="dot"><div class="ring"><svg viewBox="0 0 300 300">${dots}</svg><div class="c"><div class="time" id="d-time"></div><div class="tt" id="d-t"></div><div class="ta" id="d-a"></div></div></div>
  <div class="ctl"><button id="d-prev">⏮</button><button class="pp" id="d-pp">▶</button><button id="d-next">⏭</button></div>
  <div class="list">${T.map((t,i)=>`<div data-i="${i}" id="dl${i}"><span>${t.t}</span><span>${fmt(t.d)}</span></div>`).join('')}</div></div>`;
  on('.dot .list div','click',e=>go(+e.currentTarget.dataset.i,true));
  $('#d-prev').onclick=()=>go(S.cur-1);$('#d-next').onclick=()=>go(S.cur+1);$('#d-pp').onclick=toggle;
  this.N=N;this.update();
 },
 update(){
  const t=T[S.cur],n=Math.floor(prog()*this.N);
  set('d-time',fmt(S.pos));set('d-t',t.t);set('d-a',t.a);set('d-pp',S.play?'❚❚':'▶');
  for(let i=0;i<this.N;i++){const e=document.getElementById('dt'+i);if(e)e.setAttribute('fill',i==n?'#d71921':i<n?'#fff':'#333')}
  T.forEach((_,i)=>document.getElementById('dl'+i)?.classList.toggle('on',i==S.cur));
 }
};

function upd(){C[active].update&&C[active].update()}
function show(k){
  active=k;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
  $('#info').innerHTML=C[k].info;
  C[k].mount($('#stage'));
}
$('#tabs').innerHTML=Object.keys(C).map(k=>`<button data-k="${k}">${C[k].name}</button>`).join('');
on('.tabs button','click',e=>show(e.currentTarget.dataset.k));
show('ipod');
</script>
</body>
</html>
